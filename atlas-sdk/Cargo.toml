[package]
name = "atlas-sdk"
version = "0.1.0"
edition = "2021"

[dependencies]
default-net = "0.22"
ipnet = "2"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
socket2 = { version = "0.5", features = ["all"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros"] }
futures = "0.3"
dns-lookup = "2"